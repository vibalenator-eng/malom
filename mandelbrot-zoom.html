<!doctype html><html><meta charset="utf-8"><title>Mandelbrot zoom</title><style>body{max-width:1000px;margin:auto;padding:20px;background:#f7f1df;font:16px system-ui}.layout{display:grid;grid-template-columns:1fr 270px;gap:18px}.wrap{position:relative}.wrap canvas{display:block;width:100%;border:2px solid #18232b;background:#07111d;touch-action:none;cursor:crosshair}.selection{position:absolute;border:2px solid white;background:#ffffff33;display:none;pointer-events:none}.card{border:2px solid #18232b;border-radius:10px;padding:14px;background:#fffdf6}button,input,a{font:inherit;padding:7px;border:2px solid #18232b;border-radius:7px;background:#fff}button{display:block;width:100%;margin:7px 0;font-weight:bold}@media(max-width:700px){.layout{grid-template-columns:1fr}}</style><body><p><a href="index.html">← Malom</a> · <a href="fractals.html">Fraktálok</a> · <a href="attractors.html">Attraktorok</a></p><h1>Mandelbrot zoom</h1><div class="layout"><div class="wrap"><canvas id="canvas" width="720" height="720"></canvas><div id="selection" class="selection"></div></div><aside class="card"><p>Nyomd le a bal egérgombot, húzd a négyzetet, majd engedd el: a kijelölt terület automatikusan nagyítódik.</p><label>Iterációk <input id="iterations" type="number" value="300"></label><button id="redraw" type="button">Rajz újra</button><button id="undo" type="button">Előző nagyítás</button><button id="reset" type="button">Eredeti nézet</button><p id="status"></p></aside></div><script>const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');const selector=document.getElementById('selection');const width=720,height=720;const original={left:-2.25,top:-1.5,size:3};let view={left:-2.25,top:-1.5,size:3};let stack=[];let startPoint=null;function point(event){const rect=canvas.getBoundingClientRect();return{x:(event.clientX-rect.left)*width/rect.width,y:(event.clientY-rect.top)*height/rect.height}}function render(){const limit=Number(document.getElementById('iterations').value)||300;const image=ctx.createImageData(width,height);const data=image.data;document.getElementById('status').textContent='Újraszámolás…';setTimeout(function(){for(let y=0;y<height;y++){for(let x=0;x<width;x++){let real=0,imag=0;const cr=view.left+x/width*view.size;const ci=view.top+y/height*view.size;let step=0;while(real*real+imag*imag<4&&step<limit){const next=real*real-imag*imag+cr;imag=2*real*imag+ci;real=next;step++}const i=4*(y*width+x);const hue=255*step/limit;data[i]=step===limit?4:hue;data[i+1]=step===limit?10:70+hue*.6;data[i+2]=step===limit?18:130+hue*.4;data[i+3]=255}}ctx.putImageData(image,0,0);document.getElementById('status').textContent='Kész.'},0)}function showSelection(a,b){const side=Math.max(Math.abs(b.x-a.x),Math.abs(b.y-a.y));const left=b.x<a.x?a.x-side:a.x;const top=b.y<a.y?a.y-side:a.y;const rect=canvas.getBoundingClientRect();selector.style.display='block';selector.style.left=left/width*rect.width+'px';selector.style.top=top/height*rect.height+'px';selector.style.width=side/width*rect.width+'px';selector.style.height=side/height*rect.height+'px';return{left:left,top:top,side:side}}canvas.addEventListener('pointerdown',function(event){if(event.button!==0)return;startPoint=point(event);canvas.setPointerCapture(event.pointerId);event.preventDefault()});canvas.addEventListener('pointermove',function(event){if(startPoint)showSelection(startPoint,point(event))});canvas.addEventListener('pointerup',function(event){if(!startPoint)return;const box=showSelection(startPoint,point(event));selector.style.display='none';if(box.side>8){stack.push({...view});view={left:view.left+box.left/width*view.size,top:view.top+box.top/height*view.size,size:view.size*box.side/width};render()}startPoint=null});canvas.addEventListener('pointercancel',function(){startPoint=null;selector.style.display='none'});document.getElementById('redraw').onclick=render;document.getElementById('undo').onclick=function(){if(stack.length){view=stack.pop();render()}};document.getElementById('reset').onclick=function(){view={...original};stack=[];render()};render()</script></body></html>
