<!doctype html><html><meta charset="utf-8"><title>Attraktorok</title><style>body{max-width:1000px;margin:auto;padding:20px;background:#f7f1df;font:16px system-ui}.app{display:grid;grid-template-columns:1fr 300px;gap:18px}canvas{width:100%;background:#07111d;border:2px solid #18232b}.card{border:2px solid #18232b;border-radius:10px;padding:14px;background:#fffdf6;margin-bottom:12px}input,select,button,a{font:inherit;padding:7px;border:2px solid #18232b;border-radius:7px;background:#fff;width:100%;box-sizing:border-box;margin:4px 0}button{font-weight:bold}@media(max-width:700px){.app{grid-template-columns:1fr}}</style><body><p><a href="fractals.html">← Fraktálok</a></p><h1>Kaotikus attraktorok</h1><div class="app"><canvas id="c" width="720" height="720"></canvas><aside><section class="card"><label>Attraktor<select id="mode"><option value="lorenz">Lorenz</option><option value="rossler">Rössler</option><option value="thomas">Thomas</option><option value="aizawa">Aizawa</option></select></label><label>Rajzolási idő (mp)<input id="seconds" type="number" min="10" max="20" value="15"></label><button id="draw" type="button">Rajz újra – animálva</button><button id="reset" type="button">Alapértelmezett</button><p id="status"></p></section><section class="card"><h2 id="title"></h2><p id="theory"></p><pre id="eq"></pre></section></aside></div><script>const $=x=>document.getElementById(x),C=$('c'),X=C.getContext('2d'),M={lorenz:['Lorenz','Pillangó alakú káosz: kis kezdeti eltérés nagy pályakülönbséget ad.','dx/dt=10(y−x)\ndy/dt=x(28−z)−y\ndz/dt=xy−8z/3'],rossler:['Rössler','Spirális kaotikus áramlás.','dx/dt=−y−z\ndy/dt=x+0.2y\ndz/dt=0.2+z(x−5.7)'],thomas:['Thomas','Szimmetrikus ciklikus káosz.','dx/dt=sin(y)−0.208x\ndy/dt=sin(z)−0.208y\ndz/dt=sin(x)−0.208z'],aizawa:['Aizawa','Összetett 3D attraktor.','Paraméterezett Aizawa-rendszer']};let job=0;function pts(){let m=$('mode').value,x=.1,y=0,z=0,P=[];for(let i=0;i<18000;i++){let a,b,c;if(m==='lorenz'){a=10*(y-x);b=x*(28-z)-y;c=x*y-8*z/3}else if(m==='rossler'){a=-y-z;b=x+.2*y;c=.2+z*(x-5.7)}else if(m==='thomas'){a=Math.sin(y)-.208*x;b=Math.sin(z)-.208*y;c=Math.sin(x)-.208*z}else{a=(z-.7)*x-3.5*y;b=3.5*x+(z-.7)*y;c=.6+.95*z-z*z*z/3-(x*x+y*y)*(1+.25*z)+.1*z*x*x*x}x+=a*.005;y+=b*.005;z+=c*.005;if(i>500&&isFinite(x+z))P.push([x,z])}let xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),lo=Math.min(...xs),hi=Math.max(...xs),ly=Math.min(...ys),hy=Math.max(...ys);return P.map(p=>[30+(p[0]-lo)/(hi-lo||1)*660,690-(p[1]-ly)/(hy-ly||1)*660])}function draw(){cancelAnimationFrame(job);let p=pts(),start=performance.now(),dur=+$('seconds').value*1000;X.fillStyle='#07111d';X.fillRect(0,0,720,720);X.strokeStyle='#8dd';function tick(t){let end=Math.max(2,Math.floor(p.length*Math.min(1,(t-start)/dur)));X.beginPath();for(let i=0;i<end;i++)i?X.lineTo(...p[i]):X.moveTo(...p[i]);X.stroke();$('status').textContent=`Rajzolás: ${Math.round(end/p.length*100)}%`;if(end<p.length)job=requestAnimationFrame(tick);else $('status').textContent='Kész.'}job=requestAnimationFrame(tick)}function info(){let a=M[$('mode').value];$('title').textContent=a[0];$('theory').textContent=a[1];$('eq').textContent=a[2];draw()}$('mode').onchange=info;$('draw').onclick=draw;$('reset').onclick=()=>{$('seconds').value=15;info()};info()</script></body></html>
