<!doctype html><html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fraktál műhely</title><style>body{max-width:1180px;margin:auto;padding:18px;background:#f7f1df;color:#18232b;font:16px system-ui}header{display:flex;justify-content:space-between}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;margin-top:18px}canvas{width:100%;border:2px solid #18232b;background:#07111d}.card{border:2px solid #18232b;border-radius:10px;padding:14px;background:#fffdf6;margin-bottom:14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-weight:bold;font-size:.9em}input,select,button,a{font:inherit;padding:7px;border:2px solid #18232b;border-radius:7px;background:#fff}input,select{display:block;width:100%;box-sizing:border-box;margin-top:3px}button{font-weight:bold}.actions{display:flex;gap:8px;margin-top:14px}.status{color:#59616a}@media(max-width:800px){.layout{grid-template-columns:1fr}}@media(max-width:430px){.fields{grid-template-columns:1fr}}</style><body><header><h1>Fraktál műhely</h1><a href="index.html">← Malom</a></header><div class="layout"><div><canvas id="c" width="720" height="720"></canvas><p id="coords"></p></div><aside><section class="card"><label>Mód<select id="mode"></select></label><div id="fields" class="fields"></div><div class="actions"><button id="draw">Rajz újra</button><button id="reset">Alapértelmezett</button></div><p id="status" class="status"></p></section><section class="card"><h2 id="name"></h2><p id="theory"></p><h3>Példa</h3><pre id="example"></pre></section></aside></div><script>const $=x=>document.getElementById(x),C=$('c'),X=C.getContext('2d'),W=720,H=720;const M={mandel:{n:'Mandelbrot',f:[['it','Iterációk',180],['p','Hatvány p',2],['re','c-közép valós',-.5],['im','c-közép képzetes',0]],t:'zₙ₊₁=zₙᵖ+c. Minden pixel más komplex c érték.',e:'z₀=0\nz₁=c\nz₂=c²+c'},ship:{n:'Burning Ship',f:[['it','Iterációk',180],['p','Hatvány p',2],['re','c-közép valós',-.5],['im','c-közép képzetes',-.5]],t:'Mandelbrot abszolút értékekkel a lépés előtt.',e:'zₙ₊₁=(|Re z|+i|Im z|)²+c'},sier:{n:'Sierpiński háromszög',f:[['pts','Pontok',40000]],t:'Válassz véletlen csúcsot, majd lépj félútra felé.',e:'Pₙ₊₁=(Pₙ+csúcs)/2'},koch:{n:'Koch hópehely',f:[['depth','Rekurziós mélység',5]],t:'Minden vonalszakasz négy kisebb szakaszra cserélődik.',e:'1 szakasz → 4 → 16 → 64'},tree:{n:'L-rendszer fa',f:[['depth','Generációk',6],['angle','Ág szöge',25],['scale','Ág aránya',.7]],t:'Az ismételt szabály ágazó növényt rajzol.',e:'F → F[+F]F[-F]F'},log:{n:'Logisztikus bifurkáció',f:[['r0','r minimum',2.5],['r1','r maximum',4]],t:'Egy egyszerű képletből káosz és bifurkáció keletkezik.',e:'xₙ₊₁=r·xₙ(1−xₙ)'},newton:{n:'Newton-fraktál',f:[['p','Newton p',3]],t:'Newton-módszerrel keresi zᵖ−1=0 gyökeit; a gyök színezi a pontot.',e:'z ← z−(zᵖ−1)/(p·zᵖ⁻¹)'}};let val={};function n(k){return +val[k]}function pow(a,b,p){let r=Math.hypot(a,b)**p,t=Math.atan2(b,a)*p;return[r*Math.cos(t),r*Math.sin(t)]}function setMode(){let m=$('mode').value,o=M[m];$('name').textContent=o.n;$('theory').textContent=o.t;$('example').textContent=o.e;$('fields').innerHTML='';val={};o.f.forEach(([k,l,v])=>{$('fields').insertAdjacentHTML('beforeend',`<label>${l}<input id="v-${k}" type="number" value="${v}" step="any"></label>`);val[k]=v;$('v-'+k).oninput=e=>val[k]=e.target.value});draw()}function clear(){X.fillStyle='#07111d';X.fillRect(0,0,W,H)}function complex(ship){let d=X.createImageData(W,H),q=d.data,it=n('it'),p=n('p'),re=n('re'),im=n('im');for(let y=0;y<H;y++)for(let x=0;x<W;x++){let a=0,b=0,cr=(x/W-.5)*3+re,ci=(y/H-.5)*3+im,k=0;for(;k<it&&a*a+b*b<4;k++){if(ship){a=Math.abs(a);b=Math.abs(b)}let z=pow(a,b,p);a=z[0]+cr;b=z[1]+ci}let i=4*(y*W+x),v=255*k/it;q[i]=k==it?4:v;q[i+1]=k==it?10:70+v*.6;q[i+2]=k==it?18:130+v*.4;q[i+3]=255}X.putImageData(d,0,0);$('coords').textContent=`Re(c): ${(re-1.5).toFixed(2)} … ${(re+1.5).toFixed(2)}; Im(c): ${(im-1.5).toFixed(2)}i … ${(im+1.5).toFixed(2)}i`}function sier(){clear();let x=W/2,y=H*.1,V=[[W/2,H*.1],[W*.1,H*.9],[W*.9,H*.9]];X.fillStyle='#8dd';for(let i=0;i<n('pts');i++){let p=V[~~(Math.random()*3)];x=(x+p[0])/2;y=(y+p[1])/2;X.fillRect(x,y,1,1)}}function koch(){clear();let out=[],P=[[W*.2,H*.7],[W*.8,H*.7],[W*.5,H*.18]];function f(a,b,k){if(!k)return out.push(a);let x=(b[0]-a[0])/3,y=(b[1]-a[1])/3,u=[a[0]+x,a[1]+y],v=[a[0]+x*.5-y*.866,a[1]+y*.5+x*.866],w=[a[0]+2*x,a[1]+2*y];f(a,u,k-1);f(u,v,k-1);f(v,w,k-1);f(w,b,k-1)}for(let i=0;i<3;i++)f(P[i],P[(i+1)%3],n('depth'));X.strokeStyle='#fd7';X.beginPath();out.forEach((p,i)=>i?X.lineTo(...p):X.moveTo(...p));X.closePath();X.stroke()}function tree(){clear();let a=n('angle')*Math.PI/180,s=n('scale');X.strokeStyle='#9d9';function f(x,y,l,t,k){let u=x+Math.cos(t)*l,v=y+Math.sin(t)*l;X.beginPath();X.moveTo(x,y);X.lineTo(u,v);X.stroke();if(k){f(u,v,l*s,t-a,k-1);f(u,v,l*s,t+a,k-1)}}f(W/2,H*.94,H*.22,-Math.PI/2,n('depth'))}function log(){clear();X.fillStyle='#fd7';for(let x=0;x<W;x++){let r=n('r0')+(n('r1')-n('r0'))*x/W,v=.5;for(let i=0;i<300;i++)v=r*v*(1-v);for(let i=0;i<80;i++){v=r*v*(1-v);X.fillRect(x,H-H*v,1,1)}}}function newton(){let d=X.createImageData(W,H),q=d.data,p=n('p');for(let y=0;y<H;y++)for(let x=0;x<W;x++){let a=(x/W-.5)*4,b=(y/H-.5)*4,k=0;for(;k<30;k++){let z=pow(a,b,p),w=pow(a,b,p-1),den=p*(w[0]*w[0]+w[1]*w[1])||1,rr=((z[0]-1)*w[0]+z[1]*w[1])/den,ii=(z[1]*w[0]-(z[0]-1)*w[1])/den;a-=rr;b-=ii;if(rr*rr+ii*ii<1e-10)break}let i=4*(y*W+x),v=255-k*6,c=~~(((Math.atan2(b,a)+6.3)%6.3)/6.3*6);q[i]=c%3==0?v:25;q[i+1]=c%3==1?v:25;q[i+2]=c%3==2?v:25;q[i+3]=255}X.putImageData(d,0,0)}function draw(){let m=$('mode').value;$('status').textContent='Számítás…';setTimeout(()=>{({mandel:()=>complex(),ship:()=>complex(true),sier,koch,tree,log,newton}[m])();$('status').textContent='Kész.'},0)}Object.entries(M).forEach(([k,o])=>$('mode').add(new Option(o.n,k)));$('mode').onchange=setMode;$('draw').onclick=draw;$('reset').onclick=setMode;$('mode').value='mandel';setMode()</script></body></html>
